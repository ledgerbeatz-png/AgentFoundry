name: Build Windows portable

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller

      - name: Build portable executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name AgentFoundry launcher.py

      - name: Package portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/AgentFoundry.exe package/AgentFoundry.exe
          Copy-Item README.md package/README.md
          Copy-Item -Recurse model-manifests package/model-manifests
          Compress-Archive -Path package/* -DestinationPath AgentFoundry-portable.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentFoundry-Windows-portable
          path: AgentFoundry-portable.zip
