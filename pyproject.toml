[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfoundry"
version = "0.1.0"
description = "Local AI model manager and agent launcher"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "LedgerBeatz"}]
dependencies = []

[project.scripts]
agentfoundry = "agentfoundry.app:main"

[tool.setuptools.packages.find]
where = ["src"]
